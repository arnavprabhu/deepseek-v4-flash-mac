<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" role="img" aria-labelledby="t d">
  <title id="t">First working runtime versus current runtime</title>
  <desc id="d">Prefill went from 5.7 to about 283 tokens per second and decode from 3.3 to about 16 tokens per second, or 17 to 20 tokens per second on copy and edit prompts with server speculation, on an Apple M5 Pro with 64 GB.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --mute:#656d76; --start:#9aa4af; --now:#0969da; --spec:#8250df; --grid:#d0d7de; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --mute:#8b949e; --start:#6e7681; --now:#58a6ff; --spec:#a371f7; --grid:#30363d; } }
    .bg{fill:var(--bg)} text{fill:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:16px;font-weight:600} .l{font-size:13px} .m{font-size:12px;fill:var(--mute)} .v{font-size:13px;font-weight:600}
    .s{fill:var(--start)} .n{fill:var(--now)} .p{fill:var(--spec)} .g{stroke:var(--grid);stroke-width:1}
  </style>
  <rect class="bg" width="720" height="370" rx="8"/>
  <text class="h" x="24" y="32">From first working runtime to now (Apple M5 Pro, 64 GB)</text>

  <text class="l" x="24" y="72">Prefill (tokens/s)</text>
  <line class="g" x1="150" y1="60" x2="150" y2="150"/>
  <rect class="s" x="150" y="68" width="9.7" height="26" rx="3"/>
  <text class="v" x="170" y="86">5.7</text>
  <text class="m" x="204" y="86">start, pp512</text>
  <rect class="n" x="150" y="104" width="480" height="26" rx="3"/>
  <text class="v" x="638" y="122">~283</text>
  <text class="m" x="24" y="122">now, pp4096 (50x)</text>

  <text class="l" x="24" y="192">Decode (tokens/s)</text>
  <line class="g" x1="150" y1="180" x2="150" y2="306"/>
  <rect class="s" x="150" y="188" width="79" height="26" rx="3"/>
  <text class="v" x="239" y="206">3.3</text>
  <text class="m" x="272" y="206">start, tg64</text>
  <rect class="n" x="150" y="224" width="384" height="26" rx="3"/>
  <text class="v" x="542" y="242">~16</text>
  <text class="m" x="24" y="242">now, tg128 (4.8x)</text>
  <rect class="p" x="150" y="260" width="480" height="26" rx="3"/>
  <text class="v" x="638" y="278">17-20</text>
  <text class="m" x="24" y="278">copy/edit + spec</text>

  <text class="m" x="24" y="336">Prefill bars share one scale, decode bars share another. Now = baseline-v11; speculation bar = server n-gram drafts.</text>
  <text class="m" x="24" y="354">Start = experts on CPU via mmap. Different test lengths and prompts; see docs/BENCHMARKS.md.</text>
</svg>
